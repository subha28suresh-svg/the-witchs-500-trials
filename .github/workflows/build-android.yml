name: Build Android App Bundle

on:
  push:
    branches: [ "phase-1-mobile-prep", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Cordova Android platform
        run: npx cordova platform add android@12.0.1

      - name: Build release AAB
        run: npx cordova build android --release -- --packageType=bundle

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: WitchTrials-Release-Bundle
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
