name: Build Android App Bundle & Test APK

on:
  push:
    branches: [ "phase-1-mobile-prep", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Add Android SDK to PATH
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses & Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@13.0.0

      - name: Install Project Dependencies
        run: npm ci

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html style.css game.js www/
          cp -r data assets www/ 2>/dev/null || true
          cp riddles.js save.js www/ 2>/dev/null || true

      - name: Add Android Platform
        run: cordova platform add android@15.0.0

      - name: Verify Android Build Configuration
        run: |
          echo "Cordova CLI:"
          cordova --version

          echo "Cordova Android:"
          cordova platform ls

          echo "Generated Gradle configuration:"
          cat platforms/android/cdv-gradle-config.json

          
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode -i > release.keystore

      - name: Configure Cordova Release Signing
        env:
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOCONF > build.json
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "$KEYSTORE_PWD",
                "alias": "$ALIAS_NAME",
                "password": "$KEYSTORE_PWD",
                "keystoreType": ""
              }
            }
          }
          EOCONF

      - name: Build Signed Release APK (For Device Testing)
        run: cordova build android --release --buildConfig=build.json -- --packageType=apk

      - name: Build Signed Release AAB (For Google Play Store)
        run: cordova build android --release --buildConfig=build.json -- --packageType=bundle

      - name: Find and Upload Signed Test APK
        uses: actions/upload-artifact@v4
        with:
          name: WitchTrials-Signed-APK
          path: |
            platforms/android/app/build/outputs/**/*.apk
            platforms/android/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload Signed Play Store Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WitchTrials-PlayStore-Release-AAB
          path: platforms/android/app/build/outputs/bundle/release/*.aab