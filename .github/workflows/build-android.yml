name: Build Android App Bundle & Test APK

on:
  push:
    branches: [ "phase-1-mobile-prep", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools & Platforms
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.2"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html style.css game.js www/
          cp -r data assets www/
          cp riddles.js save.js www/ 2>/dev/null || true

      - name: Add Android Platform
        run: cordova platform add android@12.0.1

      - name: Build Debug APK (For Local Device Testing)
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.2-all.zip"
        run: cordova build android

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode -i > release.keystore

      - name: Configure Cordova Release Signing
        env:
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOCONF > build.json
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "$KEYSTORE_PWD",
                "alias": "$ALIAS_NAME",
                "password": "$KEYSTORE_PWD",
                "keystoreType": ""
              }
            }
          }
          EOCONF

      - name: Build Signed Release Android App Bundle (.aab)
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.2-all.zip"
        run: cordova build android --release --buildConfig=build.json -- --packageType=bundle

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: WitchTrials-Debug-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signed Play Store Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WitchTrials-PlayStore-Release-AAB
          path: platforms/android/app/build/outputs/bundle/release/*.aab
