<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>The Witch's 500 Trials</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <!-- =====================================
         TITLE
         ===================================== -->

    <section id="title-screen" class="screen active">

        <div class="title-content">

            <div class="crown">♛</div>

            <h1>
                The Witch's<br>
                500 Trials
            </h1>

            <p class="tagline">
                Think Like a King.<br>
                Outsmart the Witch.<br>
                Rescue the Queen.
            </p>

            <button id="start-button">
                BEGIN THE QUEST
            </button>

        </div>

    </section>


    <!-- =====================================
         INTRO COMIC
         ===================================== -->

    <section id="comic-screen" class="screen">

        <div class="comic-page">

            <img
                id="comic-image"
                src="assets/comics/intro-page-01.png"
                alt="The beginning of the King's story"
            >

            <button id="comic-next-button">
                NEXT →
            </button>

        </div>

    </section>

    <!-- STORY REVEAL SCREEN -->
    <section id="story-screen" class="screen">

        <div class="story-page">

            <img
                id="story-image"
                src=""
                alt="Story reveal"
            >

            <div class="story-content">

                <div
                    id="story-title"
                    class="story-title">
                </div>

                <div
                    id="story-text"
                    class="story-text">
                </div>

            </div>

            <button
                id="story-continue-button">
                CONTINUE →
            </button>

        </div>

    </section>

    <!-- =====================================
         LEVEL MAP
         ===================================== -->

    <section id="level-map-screen" class="screen">

        <div class="level-map">

            <!-- Region heading -->

            <header class="region-header">

                <div
                    id="region-number"
                    class="region-number">
                    REGION 1
                </div>

                <h2 id="region-name">
                    Kingdom of Aurelia
                </h2>

            </header>


            <!-- Current-level shortcut -->

            <button
                id="current-level-button"
                class="current-level-button"
                aria-label="Return to current level"
                title="Return to current level"
            >
                ↑
            </button>


            <!-- Scrollable region journey -->

            <div
                id="level-scroll"
                class="level-scroll"
            >

                <div
                    id="level-path"
                    class="level-path"
                >
                    <!-- Level nodes generated by JavaScript -->
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================
         RIDDLE SCREEN
         ===================================== -->

    <section id="riddle-screen" class="screen">

        <div class="riddle-container">

            <div class="riddle-top">

                <button
                    id="back-to-map-button"
                    class="small-button"
                >
                    ← MAP
                </button>

                <div id="riddle-level">
                    LEVEL 1
                </div>

            </div>


            <div class="riddle-card">

                <div class="witch-symbol">
                    🧙‍♀️
                </div>

                <div
                    id="witch-message"
                    class="witch-message"
                >
                    The Witch awaits your answer...
                </div>

                <div
                    id="question-text"
                    class="question-text"
                >
                </div>

                <div class="answer-area">

                    <input
                        id="answer-input"
                        type="text"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        placeholder="Type your answer"
                    >

                    <button id="submit-answer">
                        ANSWER
                    </button>

                </div>

                <div
                    id="result-message"
                    class="result-message"
                >
                </div>

                <button
                    id="next-level-button"
                    class="next-level-button hidden"
                >
                    CONTINUE →
                </button>

            </div>

        </div>

    </section>

</main>

<script src="data/questions.js"></script>
<script src="game.js"></script>

</body>
</html>
